<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Single Report Heatmap</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
  // Read coordinates from URL
  const params = new URLSearchParams(window.location.search);
  const lat = parseFloat(params.get("lat"));
  const lng = parseFloat(params.get("lng"));

  // Fallback center (Sharjah)
  const centerLat = isFinite(lat) ? lat : 25.346;
  const centerLng = isFinite(lng) ? lng : 55.420;

  // Create map
  const map = L.map("map").setView([centerLat, centerLng], 12);

  // Base map tiles
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
  }).addTo(map);

  let heatLayer;

  function updateHeat() {
    const zoom = map.getZoom();

    // Radius scales with zoom (key fix)
    const radius = Math.max(25, zoom * 6);

    if (heatLayer) {
      map.removeLayer(heatLayer);
    }

    heatLayer = L.heatLayer(
      [[lat, lng, 1.0]],
      {
        radius: radius,
        blur: radius * 0.8,
        maxZoom: 19
      }
    ).addTo(map);
  }

  // Only draw if valid coordinates exist
  if (isFinite(lat) && isFinite(lng)) {

    // Heat layer (dynamic)
    updateHeat();

    // Always-visible glow circle (fallback)
    L.circle([lat, lng], {
      radius: 600,          // meters
      color: "red",
      fillColor: "red",
      fillOpacity: 0.15,
      weight: 1
    }).addTo(map);

    // Update heat when zoom changes
    map.on("zoomend", updateHeat);
  }
</script>

</body>
</html>
