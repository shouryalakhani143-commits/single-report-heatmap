<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Single Report Heatmap</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
  // Read coordinates from URL
  const params = new URLSearchParams(window.location.search);
  const lat = parseFloat(params.get("lat"));
  const lng = parseFloat(params.get("lng"));

  // Default to Sharjah if params missing
  const centerLat = isFinite(lat) ? lat : 25.346;
  const centerLng = isFinite(lng) ? lng : 55.420;

  // Create map
  const map = L.map("map").setView([centerLat, centerLng], 14);

  // OpenStreetMap tiles (no API key needed)
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
  }).addTo(map);

  // If valid coordinates exist → show heat point
  if (isFinite(lat) && isFinite(lng)) {
    L.heatLayer([[lat, lng, 0.8]], {
      radius: 35,
      blur: 25
    }).addTo(map);
  }
</script>

</body>
</html>
